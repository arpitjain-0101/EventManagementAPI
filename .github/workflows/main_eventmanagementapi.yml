# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - EventManagementAPI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: dotnet publish
        run: dotnet publish -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_72240F4A85D44FED9EDFF091E88DE367 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9A530C23E3774F178FA567316CE93D23 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_99CADFEF571C4A83962533D63F5DF629 }}

      - name: Configure Azure Web App app settings
        uses: azure/cli@v2
        with:
          inlineScript: >
            az webapp config appsettings set
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}"
            --name "EventManagementAPI"
            --settings
            Redis__Host="${{ secrets.REDIS_HOST }}"
            Redis__Port="${{ secrets.REDIS_PORT }}"
            Redis__User="${{ secrets.REDIS_USER }}"
            Redis__Password="${{ secrets.REDIS_PASSWORD }}"
            Redis__ConnectionString="${{ secrets.REDIS_CONNECTION_STRING }}"
            Cors__AllowedOrigins__0="${{ secrets.CORS_ALLOWED_ORIGIN }}"
            AllowedHosts="*"

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'EventManagementAPI'
          slot-name: 'Production'
          package: .
